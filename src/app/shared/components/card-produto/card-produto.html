<div class="card" style="width: 18rem;">
   <img [src] = "foto">
    <div class="card-body">
    <h5 class="card-title">
        {{nomeProduto | uppercase}}<!--
     <span *ngIf="promocao; else elseBlock" class="badge text-bg-success float-end">Promoção</span>
    <ng-template #elseBlock><span class="badge text-bg-primary">Aproveite</span></ng-template>-->
    @if (promocao) {
        <span class="badge text-bg-primary">Promoção</span>
    }
    @else {
        <span class="badge text-bg-primary">Aproveite</span>
    }

</h5>
    <p class="card-text">Identificação: {{idProduto | number: '2.0-0'}}
      <br>
      Validação: {{dataValidade | date: "shortDate" }}
    </p>
    <a href="#" class="btn btn-primary float-end">  {{precoProduto |currency:"BRL"}}</a>
  </div>
</div>
